# wasmer = { path = "../wasmer/lib/api" }
# wasmer-backend-api = { path = "../wasmer/lib/backend-api" }
# wasmer-config = { path = "../wasmer/lib/config" }
# wasmer-types = { path = "../wasmer/lib/types" }
